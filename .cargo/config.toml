# Use the LLVM linker (lld) bundled with the Rust MSVC toolchain instead of the
# default MSVC `link.exe`. lld links several times faster, which matters for the
# hot-reload loop: every `cargo build -p deadsync-screens` statically links the
# whole engine into `deadsync_screens.dll`, and that link is the dominant cost of
# a warm rebuild. The bundled `rust-lld.exe` auto-detects the MSVC flavor, so no
# extra linker-flavor flag is needed.
#
# NOTE: this does NOT set `-C prefer-dynamic`; that stays in the two hot-loop
# terminals' RUSTFLAGS so it applies only to the hot host + cdylib (a shared
# dynamic std/allocator is required there) and never to release builds.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

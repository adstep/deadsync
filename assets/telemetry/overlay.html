<!DOCTYPE html>
<!--
  DeadSync live state — example OBS Browser Source overlay.

  Connects to the local telemetry WebSocket published by DeadSync when
  [Telemetry] WebSocketPort is non-zero in deadsync.ini, and renders a
  small now-playing card. Designed to be dropped straight into OBS:

    Sources → + → Browser → Local file → this file
    Width:  640    Height: 180
    Custom CSS:    body { background: rgba(0,0,0,0); }

  This is one example consumer; the same JSON is also written to
  <data dir>/telemetry/state.json and any other tool can read it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeadSync — Live State</title>
  <style>
    :root {
      --bg: rgba(0, 0, 0, 0.55);
      --fg: #f5f5f5;
      --muted: #9aa0a6;
      --accent: #ff5c8a;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--fg);
      font: 16px/1.3 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      box-sizing: border-box;
      width: 100%;
      max-width: 640px;
      padding: 16px 20px;
      background: var(--bg);
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    .screen {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 400;
    }
    .artist {
      font-size: 14px;
      color: var(--muted);
      margin-top: 2px;
    }
    .meta {
      margin-top: 10px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .meta .chip {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px 8px;
    }
    .difficulty {
      color: var(--accent);
      font-weight: 600;
    }
    .empty { color: var(--muted); }
    .status {
      position: fixed;
      top: 4px;
      right: 8px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .status.ok { color: #6cd36c; }
    .status.bad { color: #ff7f7f; }
  </style>
</head>
<body>
  <div id="status" class="status">connecting…</div>
  <div class="card">
    <div id="screen" class="screen">—</div>
    <div>
      <span id="title" class="title empty">no song</span>
      <span id="subtitle" class="subtitle"></span>
    </div>
    <div id="artist" class="artist"></div>
    <div id="meta" class="meta"></div>
  </div>

  <script>
    // Default DeadSync telemetry port; override with ?port=NNNN in the
    // browser source URL if you changed it in deadsync.ini.
    const params = new URLSearchParams(location.search);
    const port = parseInt(params.get('port') || '8765', 10);
    const url = `ws://127.0.0.1:${port}`;

    const $ = (id) => document.getElementById(id);
    const set = (id, text, cls) => {
      const el = $(id);
      el.textContent = text || '';
      if (cls !== undefined) {
        el.className = cls;
      }
    };

    function render(snapshot) {
      set('screen', snapshot.screen || '—');
      const song = snapshot.song;
      const chart = snapshot.chart;
      if (song) {
        set('title', song.title || '(untitled)', 'title');
        set('subtitle', song.subtitle || '');
        set('artist', song.artist || '');
      } else {
        set('title', 'no song', 'title empty');
        set('subtitle', '');
        set('artist', '');
      }
      const meta = $('meta');
      meta.innerHTML = '';
      if (chart) {
        const diff = document.createElement('span');
        diff.className = 'chip difficulty';
        diff.textContent = `${chart.difficulty} ${chart.meter}`;
        meta.appendChild(diff);
        if (chart.step_artist) {
          const sa = document.createElement('span');
          sa.className = 'chip';
          sa.textContent = chart.step_artist;
          meta.appendChild(sa);
        }
      }
      if (song && song.pack) {
        const pk = document.createElement('span');
        pk.className = 'chip';
        pk.textContent = song.pack;
        meta.appendChild(pk);
      }
      if (snapshot.music_rate && snapshot.music_rate !== 1.0) {
        const r = document.createElement('span');
        r.className = 'chip';
        r.textContent = `${snapshot.music_rate.toFixed(2)}x`;
        meta.appendChild(r);
      }
    }

    let backoff = 500;
    function connect() {
      set('status', `connecting ${url}…`, 'status');
      let ws;
      try {
        ws = new WebSocket(url);
      } catch (err) {
        set('status', `error: ${err.message}`, 'status bad');
        scheduleReconnect();
        return;
      }
      ws.onopen = () => {
        set('status', 'live', 'status ok');
        backoff = 500;
      };
      ws.onmessage = (ev) => {
        try {
          render(JSON.parse(ev.data));
        } catch (err) {
          console.warn('telemetry: bad payload', err);
        }
      };
      ws.onerror = () => set('status', 'error', 'status bad');
      ws.onclose = () => {
        set('status', `disconnected — retrying`, 'status bad');
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 5000);
    }

    connect();
  </script>
</body>
</html>

<!DOCTYPE html>
<!--
  DeadSync live state — VERSUS chyron overlay.

  Designed for the most common ITG tournament composition: ONE
  DeadSync versus capture in the middle of the screen with two player
  webcam feeds on either side. The in-game HUD already renders both
  players' scores, judgment counts, and combo (the center black
  column you see between the two notefields), so this overlay does
  NOT cover any of that. It only adds the broadcast frame:

  +-------------------------------------------------+
  |   SONG TITLE chyron + progress bar              | <- top, opaque
  +-------------------------------------------------+
  |  cam |    DeadSync versus capture     | cam     |
  |      |    (in-game HUD owns center)   |         |
  +-------------------------------------------------+
  |  P1  initials  |  delta  |  P2  initials        | <- bottom strip
  +-------------------------------------------------+

  Source size in OBS:
    Browser source 1920 x 1080 (or your stream resolution)
    Custom CSS:   body { background: rgba(0,0,0,0); }

  URL parameters:
    ?host=10.0.0.11   game-PC host (default 127.0.0.1)
    ?port=8765        telemetry port (default 8765)
    ?token=...        when [Telemetry] Token is set on the game PC
    ?metric=itg|ex|hardex   compare metric (default itg)
    ?bottom=1|0       show the bottom identity strip (default 1)

  Pair with versus.html if you're compositing two separate game PCs
  side-by-side instead of using a single in-game versus capture; that
  version owns the screen center.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeadSync — Versus Chyron</title>
  <style>
    :root {
      --bg-chyron: rgba(8, 8, 16, 0.92);
      --bg-strip: rgba(8, 8, 16, 0.85);
      --fg: #f5f5f5;
      --muted: #9aa0a6;
      --accent: #ff5c8a;
      --p1: #4ea8ff;
      --p2: #ff6868;
      --good: #6cd36c;
      --bad: #ff7f7f;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      color: var(--fg);
      font: 16px/1.2 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* TOP CHYRON ----------------------------------------------------- */
    .chyron {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 10px 22px;
      background: var(--bg-chyron);
      border-bottom: 2px solid var(--accent);
    }
    .difficulty-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent);
      color: #1a0010;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .song-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .song-title .title {
      font-size: 22px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-title .artist {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-title .empty { color: var(--muted); font-style: italic; }
    .right-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .right-meta .chip {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      padding: 2px 8px;
    }
    .right-meta .modifier {
      background: rgba(255, 215, 102, 0.18);
      color: #ffd166;
      font-weight: 600;
    }
    .progress {
      grid-column: 1 / span 3;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress.hidden { visibility: hidden; }
    .progress > .fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 250ms linear;
    }

    /* BOTTOM IDENTITY STRIP ----------------------------------------- */
    .strip {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: center;
      width: 100%;
      padding: 10px 22px;
      background: var(--bg-strip);
      border-top: 2px solid rgba(255, 255, 255, 0.12);
    }
    .strip.hidden { display: none; }
    .player {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .player.p2 { grid-template-columns: auto 1fr 44px; text-align: right; }
    .player .badge {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
    }
    .player.p1 .badge { background: var(--p1); }
    .player.p2 .badge { background: var(--p2); }
    .player .ident {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .player .name {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player .pb {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .player .pb .positive { color: var(--good); font-weight: 700; }
    .player .pb .negative { color: var(--bad); }
    .player .modifier-chip {
      background: rgba(255, 215, 102, 0.18);
      color: #ffd166;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      margin-right: 4px;
    }
    .player.p2 .ident { align-items: flex-end; }
    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 200px;
    }
    .delta {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .delta.p1 { color: var(--p1); }
    .delta.p2 { color: var(--p2); }
    .delta.tied { color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
    .lead-change {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      transition: opacity 400ms ease-out;
      min-height: 12px;
    }
    .lead-change.p1 { color: var(--p1); }
    .lead-change.p2 { color: var(--p2); }
    .lead-change.fade { opacity: 0; }

    .status {
      position: fixed;
      top: 4px;
      right: 8px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .status.ok { color: var(--good); }
    .status.bad { color: var(--bad); }
  </style>
</head>
<body>
  <div id="status" class="status">connecting…</div>

  <div class="chyron">
    <div class="difficulty-pill" id="diff-pill" style="display: none;">--</div>
    <div class="song-title">
      <div id="title" class="title empty">no song</div>
      <div id="artist" class="artist"></div>
    </div>
    <div class="right-meta" id="right-meta"></div>
    <div id="progress" class="progress hidden"><div id="progress-fill" class="fill"></div></div>
  </div>

  <div id="strip" class="strip">
    <div class="player p1">
      <div class="badge p1" id="p1-badge">P1</div>
      <div class="ident">
        <div class="name p1" id="p1-name">P1</div>
        <div class="pb" id="p1-pb"></div>
      </div>
      <div id="p1-mods"></div>
    </div>
    <div class="center-block">
      <div id="lead-change" class="lead-change fade"></div>
      <div id="delta" class="delta tied">tied</div>
      <div id="metric-label" style="font-size: 9px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase;">ITG %</div>
    </div>
    <div class="player p2">
      <div id="p2-mods"></div>
      <div class="ident">
        <div class="name p2" id="p2-name">P2</div>
        <div class="pb" id="p2-pb"></div>
      </div>
      <div class="badge p2" id="p2-badge">P2</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const host = params.get('host') || '127.0.0.1';
    const port = parseInt(params.get('port') || '8765', 10);
    const token = params.get('token') || '';
    const tokenSuffix = token ? `?token=${encodeURIComponent(token)}` : '';
    const metric = (params.get('metric') || 'itg').toLowerCase();
    const showStrip = params.get('bottom') !== '0';

    const METRICS = {
      itg:    { field: 'score_percent',         label: 'ITG %',     pb: 'itg' },
      ex:     { field: 'ex_score_percent',      label: 'EX %',      pb: 'ex' },
      hardex: { field: 'hard_ex_score_percent', label: 'HARD EX %', pb: 'hard_ex' },
    };
    const cfg = METRICS[metric] || METRICS.itg;
    document.getElementById('metric-label').textContent = cfg.label;
    if (!showStrip) document.getElementById('strip').classList.add('hidden');

    const url = `ws://${host}:${port}${tokenSuffix}`;
    const $ = (id) => document.getElementById(id);

    function modifierChips(mods) {
      if (!mods || !mods.length) return '';
      return mods.map((m) => `<span class="modifier-chip">${m}</span>`).join('');
    }

    function pbLine(player) {
      if (!player || !player.personal_best) return '';
      const pb = player.personal_best[cfg.pb];
      const live = Number(player[cfg.field]);
      if (!Number.isFinite(pb) || !Number.isFinite(live)) return '';
      const delta = live - pb;
      const cls = delta >= 0 ? 'positive' : 'negative';
      const sign = delta >= 0 ? '+' : '−';
      return `${cfg.label} PB <span class="${cls}">${sign}${(Math.abs(delta) * 100).toFixed(2)}%</span>`;
    }

    function renderPlayer(sideKey, player) {
      const badge = $(`${sideKey}-badge`);
      const name = $(`${sideKey}-name`);
      const pb = $(`${sideKey}-pb`);
      const mods = $(`${sideKey}-mods`);
      if (!player) {
        badge.textContent = sideKey.toUpperCase();
        name.textContent = sideKey.toUpperCase();
        pb.innerHTML = '';
        mods.innerHTML = '';
        return null;
      }
      const initials = (player.initials || '').trim();
      badge.textContent = initials || sideKey.toUpperCase();
      name.textContent = player.profile_name || sideKey.toUpperCase();
      pb.innerHTML = pbLine(player);
      mods.innerHTML = modifierChips(player.modifiers);
      return Number(player[cfg.field]) || 0;
    }

    // Sliding-window lead delta tracker.
    const LEAD_WINDOW_MS = 10_000;
    const leadSamples = [];
    let leadFadeTimer = 0;
    function updateLeadChange(diff) {
      const t = Date.now();
      leadSamples.push([t, diff]);
      while (leadSamples.length > 0 && t - leadSamples[0][0] > LEAD_WINDOW_MS) {
        leadSamples.shift();
      }
      const el = $('lead-change');
      if (leadSamples.length < 2) return;
      const oldest = leadSamples[0][1];
      const swing = diff - oldest;
      if (Math.abs(swing) < 0.0005) {
        el.classList.add('fade');
        return;
      }
      const sign = swing > 0 ? '+' : '−';
      el.textContent = `${sign}${(Math.abs(swing) * 100).toFixed(2)}% in last ${Math.round(LEAD_WINDOW_MS / 1000)}s`;
      el.classList.remove('p1', 'p2', 'fade');
      el.classList.add(swing > 0 ? 'p1' : 'p2');
      clearTimeout(leadFadeTimer);
      leadFadeTimer = setTimeout(() => el.classList.add('fade'), 4000);
    }

    function renderTopChyron(snapshot) {
      const song = snapshot.song;
      const chart = snapshot.chart;
      const title = $('title');
      const artist = $('artist');
      const pill = $('diff-pill');
      const meta = $('right-meta');

      if (song) {
        let titleText = song.title || '(untitled)';
        if (song.subtitle) titleText += ' ' + song.subtitle;
        title.textContent = titleText;
        title.className = 'title';
        artist.textContent = song.artist || '';
      } else {
        title.textContent = 'no song';
        title.className = 'title empty';
        artist.textContent = '';
      }

      if (chart && chart.difficulty) {
        pill.style.display = '';
        pill.textContent = `${chart.difficulty} ${chart.meter}`;
      } else {
        pill.style.display = 'none';
      }

      // Right-meta: pack chip + per-player modifier chips (deduped) + music_rate.
      meta.innerHTML = '';
      if (song && song.pack) {
        const c = document.createElement('span');
        c.className = 'chip';
        c.textContent = song.pack;
        meta.appendChild(c);
      }
      const rate = Number(snapshot.music_rate);
      if (Number.isFinite(rate) && Math.abs(rate - 1.0) > 1e-3) {
        const c = document.createElement('span');
        c.className = 'chip modifier';
        c.textContent = `${rate.toFixed(2)}x`;
        meta.appendChild(c);
      }

      // Progress bar.
      const denom =
        (song && Number(song.chart_length_seconds)) ||
        (song && Number(song.music_length_seconds)) || 0;
      const elapsed = Number(snapshot.elapsed_seconds);
      const progress = $('progress');
      if (denom > 0 && Number.isFinite(elapsed) && elapsed >= 0) {
        progress.classList.remove('hidden');
        $('progress-fill').style.width = `${Math.max(0, Math.min(100, (elapsed / denom) * 100))}%`;
      } else {
        progress.classList.add('hidden');
        $('progress-fill').style.width = '0%';
      }
    }

    function render(snapshot) {
      renderTopChyron(snapshot);

      if (!showStrip) return;
      const players = Array.isArray(snapshot.players) ? snapshot.players : [];
      const v1 = renderPlayer('p1', players[0] || null);
      const v2 = renderPlayer('p2', players[1] || null);

      const delta = $('delta');
      if (v1 == null || v2 == null) {
        delta.textContent = '';
        delta.className = 'delta tied';
        return;
      }
      const diff = v1 - v2;
      if (Math.abs(diff) < 1e-5) {
        delta.textContent = 'tied';
        delta.className = 'delta tied';
      } else {
        const sign = diff > 0 ? '+' : '−';
        delta.textContent = `${sign}${(Math.abs(diff) * 100).toFixed(2)}%`;
        delta.className = `delta ${diff > 0 ? 'p1' : 'p2'}`;
      }
      updateLeadChange(diff);
    }

    let backoff = 500;
    function connect() {
      $('status').textContent = `connecting ${url}…`;
      $('status').className = 'status';
      let ws;
      try { ws = new WebSocket(url); }
      catch (err) {
        $('status').textContent = `error: ${err.message}`;
        $('status').className = 'status bad';
        scheduleReconnect();
        return;
      }
      ws.onopen = () => {
        $('status').textContent = `live · ${cfg.label}`;
        $('status').className = 'status ok';
        backoff = 500;
      };
      ws.onmessage = (ev) => {
        try { render(JSON.parse(ev.data)); }
        catch (err) { console.warn('telemetry: bad payload', err); }
      };
      ws.onerror = () => {
        $('status').textContent = 'error';
        $('status').className = 'status bad';
      };
      ws.onclose = () => {
        $('status').textContent = 'disconnected — retrying';
        $('status').className = 'status bad';
        scheduleReconnect();
      };
    }
    function scheduleReconnect() {
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 5000);
    }
    connect();
  </script>
</body>
</html>

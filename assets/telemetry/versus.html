<!DOCTYPE html>
<!--
  DeadSync live state — VERSUS overlay (center-column layout).

  Mirrors the in-game StepStatistics center column at the dead center
  of the screen so the OBS overlay opaquely covers the in-game version
  rather than displaying the same numbers in two places. Designed to
  be layered on top of a full-screen game capture in OBS at 1920x1080.

  Source size in OBS:
    Browser source 1920 x 1080 (or your stream resolution)
    Custom CSS:   body { background: rgba(0,0,0,0); }

  URL parameters:
    ?host=10.0.0.11   game-PC host (default 127.0.0.1)
    ?port=8765        telemetry port (default 8765)
    ?token=...        when [Telemetry] Token is set on the game PC
    ?metric=itg|ex|hardex   compare metric (default itg)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeadSync — Versus</title>
  <style>
    :root {
      --bg-card: rgba(0, 0, 0, 0.62);
      --bg-center: rgba(0, 0, 0, 0.95);
      --fg: #f5f5f5;
      --muted: #9aa0a6;
      --p1: #4ea8ff;
      --p2: #ff6868;
      --neutral: #888;
      --good: #6cd36c;
      --bad: #ff7f7f;
      /* Engine judgment palette — matches src/engine/present/color.rs
         JUDGMENT_RGBA / JUDGMENT_DIM_RGBA. W0 is the FA+ inner-Fantastic
         white, the rest follow the StepMania Simply Love convention. */
      --w0:        #FFFFFF; --w0-dim:        #595959;
      --w1:        #21CCE8; --w1-dim:        #0C4E59;
      --w2:        #E29C18; --w2-dim:        #593D09;
      --w3:        #66C955; --w3-dim:        #2D5925;
      --w4:        #B45CFF; --w4-dim:        #3F2059;
      --w5:        #C9855E; --w5-dim:        #593B29;
      --miss:      #FF3030; --miss-dim:      #591010;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      color: var(--fg);
      font: 16px/1.2 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Debug background — only shown when ?bg=1 is set so you can preview
       the overlay over a captured frame of an actual stream. Drop your
       own image at assets/telemetry/_debug_bg.png (gitignored). */
    body.debug-bg {
      background: #000 url('./_debug_bg.png') center/contain no-repeat;
    }
    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .stage {
      display: grid;
      /* Center column sized to roughly match the in-game StepStatistics
         column proportion (~22% of a typical 16:9 capture). Side panels
         sit just outside it so the layout stays compact even when laid
         over a full-screen game capture. */
      grid-template-columns: 240px 1fr 240px;
      align-items: stretch;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: var(--bg-center);
      padding: 16px 12px 8px 12px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.4);
      max-width: 420px;
      justify-self: center;
      width: 100%;
    }
    /* Side panels: identity only, transparent except the small card. */
    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      max-height: 50vh;
      align-self: center;
    }
    .panel.left { border-radius: 0 12px 12px 0; }
    .panel.right { border-radius: 12px 0 0 12px; text-align: right; align-items: flex-end; }
    .name {
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .name.p1 { color: var(--p1); }
    .name.p2 { color: var(--p2); }
    .grade {
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .grade.pulse { animation: grade-pulse 700ms ease-out; }
    @keyframes grade-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.5); color: #fff; text-shadow: 0 0 14px var(--neutral); }
      100% { transform: scale(1); }
    }
    .pb-delta {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .pb-delta .positive { color: var(--good); font-weight: 600; }
    .pb-delta .negative { color: var(--bad); }

    /* Center column: opaque, full height, covers the in-game center column. */
    .scores-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      align-items: end;
      margin-bottom: 4px;
    }
    .score {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .score.p1 { text-align: right; color: var(--p1); }
    .score.p2 { text-align: left;  color: var(--p2); }
    .metric-label {
      grid-column: 1 / span 2;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-top: 2px;
    }

    /* Judgment stack: P1 count | LABEL | P2 count, one row per window.
       Visual is a deliberate echo of the in-game StepStatistics center
       column rendered with the Wendy bitmap font: tall, heavy, condensed
       digits in tabular columns, with leading zeros dimmed so the eye
       reads only the actual count.

       Wendy is a bitmap-only font and not embeddable as @font-face, so
       we approximate with `Impact` (universal on Windows / macOS, with
       solid fallbacks for Linux). It's the closest free system font to
       Wendy's tall heavy display look. */
    .judgments {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .jrow {
      display: grid;
      grid-template-columns: 1fr 28px 1fr;
      align-items: center;
      font-family: Impact, "Arial Narrow Bold", "Helvetica Neue Condensed Bold",
                   "Liberation Sans Narrow", sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .jrow .lbl {
      text-align: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      align-self: center;
    }
    .jrow .p1c { text-align: right; padding-right: 6px; }
    .jrow .p2c { text-align: left;  padding-left: 6px; }
    /* Per-row colors. Bright = engine JUDGMENT_RGBA, dim = engine
       JUDGMENT_DIM_RGBA (proper darker per-row hue, not just an
       opacity drop — matches the in-game Wendy column rendering). */
    .digits .bright { opacity: 1; }
    .jrow.w0  .digits .dim    { color: var(--w0-dim); }
    .jrow.w1  .digits .dim    { color: var(--w1-dim); }
    .jrow.w2  .digits .dim    { color: var(--w2-dim); }
    .jrow.w3  .digits .dim    { color: var(--w3-dim); }
    .jrow.w4  .digits .dim    { color: var(--w4-dim); }
    .jrow.w5  .digits .dim    { color: var(--w5-dim); }
    .jrow.miss .digits .dim   { color: var(--miss-dim); }
    .jrow.w0 .lbl, .jrow.w0 .p1c .bright, .jrow.w0 .p2c .bright { color: var(--w0); }
    .jrow.w1 .lbl, .jrow.w1 .p1c .bright, .jrow.w1 .p2c .bright { color: var(--w1); }
    .jrow.w2 .lbl, .jrow.w2 .p1c .bright, .jrow.w2 .p2c .bright { color: var(--w2); }
    .jrow.w3 .lbl, .jrow.w3 .p1c .bright, .jrow.w3 .p2c .bright { color: var(--w3); }
    .jrow.w4 .lbl, .jrow.w4 .p1c .bright, .jrow.w4 .p2c .bright { color: var(--w4); }
    .jrow.w5 .lbl, .jrow.w5 .p1c .bright, .jrow.w5 .p2c .bright { color: var(--w5); }
    .jrow.miss .lbl, .jrow.miss .p1c .bright, .jrow.miss .p2c .bright { color: var(--miss); }
    .jrow .flash { animation: miss-flash 800ms ease-out; }
    @keyframes miss-flash {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.35); color: #fff; text-shadow: 0 0 14px var(--miss); }
      100% { transform: scale(1); }
    }

    /* Lead bar + change indicator. */
    .lead-block {
      margin-top: auto;
      padding-top: 8px;
    }
    .lead-change {
      font-size: 11px;
      min-height: 14px;
      margin-bottom: 4px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
      transition: opacity 400ms ease-out;
    }
    .lead-change.p1 { color: var(--p1); }
    .lead-change.p2 { color: var(--p2); }
    .lead-change.fade { opacity: 0; }
    .delta {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
      min-height: 18px;
      margin-bottom: 4px;
    }
    .delta.p1 { color: var(--p1); }
    .delta.p2 { color: var(--p2); }
    .delta.tied { color: var(--neutral); }
    .h2h {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
    .h2h .fill {
      position: absolute;
      top: 0;
      bottom: 0;
      transition: width 200ms ease-out;
    }
    .h2h .fill.p1 { left: 0; background: linear-gradient(90deg, transparent, var(--p1)); }
    .h2h .fill.p2 { right: 0; background: linear-gradient(270deg, transparent, var(--p2)); }
    .progress {
      margin-top: 6px;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress.hidden { visibility: hidden; }
    .progress > .fill {
      height: 100%;
      background: var(--neutral);
      width: 0%;
      transition: width 250ms linear;
    }
    .status {
      position: fixed;
      top: 4px;
      right: 8px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .status.ok { color: var(--good); }
    .status.bad { color: var(--bad); }
    .empty .score { opacity: 0.35; }
  </style>
</head>
<body>
  <div id="status" class="status">connecting…</div>
  <div class="stage">
    <div id="p1" class="panel left empty">
      <div class="name p1" id="p1-name">P1</div>
      <div class="grade" id="p1-grade"></div>
      <div class="pb-delta" id="p1-pb"></div>
    </div>

    <div class="center">
      <div class="scores-row">
        <div class="score p1" id="p1-score">--.--%</div>
        <div class="score p2" id="p2-score">--.--%</div>
        <div class="metric-label" id="metric-label">ITG %</div>
      </div>
      <div class="judgments" id="judgments"></div>
      <div class="lead-block">
        <div id="lead-change" class="lead-change fade"></div>
        <div id="delta" class="delta tied">tied</div>
        <div class="h2h">
          <div id="h2h-p1" class="fill p1" style="width: 50%;"></div>
          <div id="h2h-p2" class="fill p2" style="width: 50%;"></div>
        </div>
        <div id="progress" class="progress hidden"><div id="progress-fill" class="fill"></div></div>
      </div>
    </div>

    <div id="p2" class="panel right empty">
      <div class="name p2" id="p2-name">P2</div>
      <div class="grade" id="p2-grade"></div>
      <div class="pb-delta" id="p2-pb"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const host = params.get('host') || '127.0.0.1';
    const port = parseInt(params.get('port') || '8765', 10);
    const token = params.get('token') || '';
    const tokenSuffix = token ? `?token=${encodeURIComponent(token)}` : '';
    const metric = (params.get('metric') || 'itg').toLowerCase();

    const METRICS = {
      itg:    { field: 'score_percent',         label: 'ITG %',     pb: 'itg' },
      ex:     { field: 'ex_score_percent',      label: 'EX %',      pb: 'ex' },
      hardex: { field: 'hard_ex_score_percent', label: 'HARD EX %', pb: 'hard_ex' },
    };
    const cfg = METRICS[metric] || METRICS.itg;
    document.getElementById('metric-label').textContent = cfg.label;

    // ?bg=1 layers a captured stream frame behind the overlay so you
    // can preview alignment without running a real DeadSync. The image
    // is loaded from ./_debug_bg.png (gitignored — drop your own frame
    // grab there).
    if (params.get('bg') === '1' || params.get('debug') === '1') {
      document.body.classList.add('debug-bg');
    }

    // Match the in-game judgment stack ordering: W0..W5 + Miss.
    // W0 only renders when at least one player has FA+ counts > 0; the row
    // is hidden otherwise to match what most casts show.
    const ROWS = [
      { key: 'w0', label: 'F+' },
      { key: 'w1', label: 'F'  },
      { key: 'w2', label: 'EX' },
      { key: 'w3', label: 'GR' },
      { key: 'w4', label: 'DC' },
      { key: 'w5', label: 'WO' },
      { key: 'miss', label: 'M' },
    ];

    const GRADE_ORDER = [
      'Failed', 'Tier17', 'Tier16', 'Tier15', 'Tier14', 'Tier13', 'Tier12',
      'Tier11', 'Tier10', 'Tier09', 'Tier08', 'Tier07', 'Tier06', 'Tier05',
      'Tier04', 'Tier03', 'Tier02', 'Tier01', 'Quint',
    ];
    const gradeIdx = (g) => {
      const i = GRADE_ORDER.indexOf(g || '');
      return i < 0 ? -1 : i;
    };

    const url = `ws://${host}:${port}${tokenSuffix}`;
    const $ = (id) => document.getElementById(id);
    const fmtPct = (x) => (x * 100).toFixed(2) + '%';

    function modifierChips(mods) {
      if (!mods || !mods.length) return '';
      return mods.map((m) => `<span class="modifier-chip">${m}</span>`).join('');
    }

    function pbLine(player) {
      if (!player || !player.personal_best) return '';
      const pb = player.personal_best[cfg.pb];
      const live = Number(player[cfg.field]);
      if (!Number.isFinite(pb) || !Number.isFinite(live)) return '';
      const delta = live - pb;
      const cls = delta >= 0 ? 'positive' : 'negative';
      const sign = delta >= 0 ? '+' : '−';
      return `${cfg.label} PB <span class="${cls}">${sign}${(Math.abs(delta) * 100).toFixed(2)}%</span>`;
    }

    // Per-side previous values for combo-break / grade-up detection.
    const prev = { p1: { miss: 0, grade: null }, p2: { miss: 0, grade: null } };

    function renderSidePanel(sideKey, player) {
      const panel = $(sideKey);
      const name = $(`${sideKey}-name`);
      const grade = $(`${sideKey}-grade`);
      const pb = $(`${sideKey}-pb`);

      if (!player) {
        panel.classList.add('empty');
        name.textContent = sideKey.toUpperCase();
        grade.textContent = '';
        pb.innerHTML = '';
        return;
      }
      panel.classList.remove('empty');
      name.textContent = player.profile_name || sideKey.toUpperCase();

      const pState = prev[sideKey];
      const newGrade = player.grade || null;
      if (pState.grade && newGrade && gradeIdx(newGrade) > gradeIdx(pState.grade)) {
        grade.classList.remove('pulse');
        // eslint-disable-next-line no-void
        void grade.offsetWidth;
        grade.classList.add('pulse');
      }
      grade.textContent = newGrade || '';

      pb.innerHTML = pbLine(player);
    }

    function renderScore(sideKey, player) {
      const el = $(`${sideKey}-score`);
      if (!player) {
        el.textContent = '--.--%';
        el.classList.add('faded');
        return null;
      }
      el.classList.remove('faded');
      const value = Number(player[cfg.field]) || 0;
      el.textContent = fmtPct(value);
      return value;
    }

    // Build / update the judgment stack centered between the two players.
    // Renders each cell as `<span class="dim">000</span><span class="bright">12</span>`
    // so leading zeros fade out, mirroring the Wendy-bitmap-font look the
    // in-game StepStatistics column uses (see `cached_padded_runs` in
    // src/screens/components/gameplay/gameplay_stats.rs).
    const PAD_DIGITS = 4;
    function digitsHtml(value) {
      const n = Math.max(0, value | 0);
      const s = String(n).padStart(PAD_DIGITS, '0');
      // Number of leading characters that should be dimmed.
      const dimLen = n === 0 ? PAD_DIGITS - 1 : Math.max(0, PAD_DIGITS - String(n).length);
      const dim = s.slice(0, dimLen);
      const bright = s.slice(dimLen);
      return `<span class="digits"><span class="dim">${dim}</span><span class="bright">${bright}</span></span>`;
    }

    function renderJudgments(p1, p2) {
      const container = $('judgments');
      const p1j = (p1 && p1.judgments) || {};
      const p2j = (p2 && p2.judgments) || {};

      // Hide the W0 row unless someone has a count there (only relevant
      // for FA+ casts).
      const showW0 = (p1j.w0 || 0) > 0 || (p2j.w0 || 0) > 0;

      // Lazy-build the rows once.
      if (container.childElementCount !== ROWS.length) {
        container.innerHTML = '';
        for (const row of ROWS) {
          const div = document.createElement('div');
          div.className = `jrow ${row.key}`;
          div.innerHTML =
            `<span class="p1c" data-key="${row.key}-p1">${digitsHtml(0)}</span>` +
            `<span class="lbl">${row.label}</span>` +
            `<span class="p2c" data-key="${row.key}-p2">${digitsHtml(0)}</span>`;
          container.appendChild(div);
        }
      }

      for (const row of ROWS) {
        const rowEl = container.querySelector(`.jrow.${row.key}`);
        rowEl.style.display = (row.key === 'w0' && !showW0) ? 'none' : '';
        const p1c = rowEl.querySelector('.p1c');
        const p2c = rowEl.querySelector('.p2c');
        const p1v = (p1j[row.key] || 0);
        const p2v = (p2j[row.key] || 0);
        p1c.innerHTML = digitsHtml(p1v);
        p2c.innerHTML = digitsHtml(p2v);
      }

      // Combo-break flash on miss going 0 -> n, both sides.
      ['p1', 'p2'].forEach((sideKey) => {
        const newMiss = (sideKey === 'p1' ? p1j.miss : p2j.miss) || 0;
        const pState = prev[sideKey];
        if (pState.miss === 0 && newMiss > 0) {
          const cell = container.querySelector(`.jrow.miss .${sideKey}c`);
          if (cell) {
            cell.classList.remove('flash');
            // eslint-disable-next-line no-void
            void cell.offsetWidth;
            cell.classList.add('flash');
          }
        }
        pState.miss = newMiss;
      });
    }

    // Sliding-window lead-change indicator.
    const LEAD_WINDOW_MS = 10_000;
    const leadSamples = [];
    let leadFadeTimer = 0;
    function updateLeadChange(diff) {
      const t = Date.now();
      leadSamples.push([t, diff]);
      while (leadSamples.length > 0 && t - leadSamples[0][0] > LEAD_WINDOW_MS) {
        leadSamples.shift();
      }
      const el = $('lead-change');
      if (leadSamples.length < 2) return;
      const oldest = leadSamples[0][1];
      const swing = diff - oldest;
      if (Math.abs(swing) < 0.0005) {
        el.classList.add('fade');
        return;
      }
      const sign = swing > 0 ? '+' : '−';
      el.textContent = `${sign}${(Math.abs(swing) * 100).toFixed(2)}% in last ${Math.round(LEAD_WINDOW_MS / 1000)}s`;
      el.classList.remove('p1', 'p2', 'fade');
      el.classList.add(swing > 0 ? 'p1' : 'p2');
      clearTimeout(leadFadeTimer);
      leadFadeTimer = setTimeout(() => el.classList.add('fade'), 4000);
    }

    function leadToBias(delta) {
      const sign = Math.sign(delta);
      const mag = Math.min(Math.abs(delta), 0.05) / 0.05;
      const eased = 1 - Math.pow(1 - mag, 3);
      return sign * eased;
    }

    function render(snapshot) {
      const players = Array.isArray(snapshot.players) ? snapshot.players : [];
      const p1 = players[0] || null;
      const p2 = players[1] || null;

      renderSidePanel('p1', p1);
      renderSidePanel('p2', p2);
      const v1 = renderScore('p1', p1);
      const v2 = renderScore('p2', p2);
      renderJudgments(p1, p2);

      const delta = $('delta');
      const fillP1 = $('h2h-p1');
      const fillP2 = $('h2h-p2');

      if (v1 == null || v2 == null) {
        delta.textContent = '';
        delta.className = 'delta tied';
        fillP1.style.width = '50%';
        fillP2.style.width = '50%';
      } else {
        const diff = v1 - v2;
        if (Math.abs(diff) < 1e-5) {
          delta.textContent = 'tied';
          delta.className = 'delta tied';
        } else {
          const sign = diff > 0 ? '+' : '−';
          delta.textContent = `${sign}${(Math.abs(diff) * 100).toFixed(2)}%`;
          delta.className = `delta ${diff > 0 ? 'p1' : 'p2'}`;
        }
        const bias = leadToBias(diff);
        const p1Pct = 50 + bias * 50;
        const p2Pct = 50 - bias * 50;
        fillP1.style.width = `${Math.max(0, Math.min(100, p1Pct))}%`;
        fillP2.style.width = `${Math.max(0, Math.min(100, p2Pct))}%`;
        updateLeadChange(diff);
      }

      const song = snapshot.song;
      const denom =
        (song && Number(song.chart_length_seconds)) ||
        (song && Number(song.music_length_seconds)) || 0;
      const elapsed = Number(snapshot.elapsed_seconds);
      const progress = $('progress');
      if (denom > 0 && Number.isFinite(elapsed) && elapsed >= 0) {
        progress.classList.remove('hidden');
        $('progress-fill').style.width = `${Math.max(0, Math.min(100, (elapsed / denom) * 100))}%`;
      } else {
        progress.classList.add('hidden');
        $('progress-fill').style.width = '0%';
      }
    }

    let backoff = 500;
    function connect() {
      $('status').textContent = `connecting ${url}…`;
      $('status').className = 'status';
      let ws;
      try { ws = new WebSocket(url); }
      catch (err) {
        $('status').textContent = `error: ${err.message}`;
        $('status').className = 'status bad';
        scheduleReconnect();
        return;
      }
      ws.onopen = () => {
        $('status').textContent = `live · ${cfg.label}`;
        $('status').className = 'status ok';
        backoff = 500;
      };
      ws.onmessage = (ev) => {
        try { render(JSON.parse(ev.data)); }
        catch (err) { console.warn('telemetry: bad payload', err); }
      };
      ws.onerror = () => {
        $('status').textContent = 'error';
        $('status').className = 'status bad';
      };
      ws.onclose = () => {
        $('status').textContent = 'disconnected — retrying';
        $('status').className = 'status bad';
        scheduleReconnect();
      };
    }
    function scheduleReconnect() {
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 5000);
    }

    /* ---------------- Demo mode ----------------
       Open this file with ?demo=1 (or no host configured AND on file://)
       to drive a synthetic stream of snapshots without a running
       DeadSync. Useful for designing/testing the overlay locally; never
       runs unless explicitly requested.

       Simulates a 120-second song with both players' scores climbing,
       lead handing back and forth, occasional misses (to trigger the
       miss-flash), and grade upgrades crossing tier thresholds.
    */
    const demoExplicit = params.get('demo') === '1';
    function startDemo() {
      $('status').textContent = `DEMO · ${cfg.label}`;
      $('status').className = 'status ok';

      const SONG = {
        title: 'Arcology On Permafrost',
        subtitle: '',
        artist: 'qishipai',
        pack: 'Tournament Pack',
        display_bpm: '180',
        music_length_seconds: 124,
        chart_length_seconds: 120,
        banner_path: null,
        background_path: null,
      };
      const CHART = {
        id: 'demoaaaa',
        difficulty: 'Challenge',
        meter: 13,
        step_artist: 'demo',
        stepstype: 'dance-single',
      };
      const TIER_BREAKS = [
        ['Quint', 1.001], ['Tier01', 1.0],   ['Tier02', 0.99], ['Tier03', 0.98],
        ['Tier04', 0.96], ['Tier05', 0.94],  ['Tier06', 0.92], ['Tier07', 0.89],
        ['Tier08', 0.86], ['Tier09', 0.83],  ['Tier10', 0.80], ['Tier11', 0.76],
        ['Tier12', 0.72], ['Tier13', 0.68],  ['Tier14', 0.64], ['Tier15', 0.60],
        ['Tier16', 0.55], ['Tier17', 0.0],
      ];
      function gradeFor(score) {
        for (const [g, threshold] of TIER_BREAKS) {
          if (score >= threshold) return g;
        }
        return 'Failed';
      }

      const players = [
        { name: 'Tony',   ini: 'TNY', mods: ['Mirror'], target: 0.972 },
        { name: 'Rynker', ini: 'RNK', mods: ['1.05x'],  target: 0.968 },
      ];

      let elapsed = 0;
      const judgments = [
        { w0: 0, w1: 0, w2: 0, w3: 0, w4: 0, w5: 0, miss: 0 },
        { w0: 0, w1: 0, w2: 0, w3: 0, w4: 0, w5: 0, miss: 0 },
      ];
      let totalNotes = 1100; // pretend chart has ~1100 notes

      function step() {
        elapsed += 0.25;
        if (elapsed > SONG.chart_length_seconds + 4) {
          // Restart the song.
          elapsed = 0;
          for (let i = 0; i < 2; i++) {
            judgments[i] = { w0: 0, w1: 0, w2: 0, w3: 0, w4: 0, w5: 0, miss: 0 };
          }
        }

        const progress = Math.max(0, Math.min(1, elapsed / SONG.chart_length_seconds));
        for (let i = 0; i < 2; i++) {
          // Tick a few notes per step, mostly Fantastic, occasionally drift.
          const tick = 2 + Math.floor(Math.random() * 4);
          for (let n = 0; n < tick; n++) {
            const r = Math.random();
            // Player target accuracy biases the random distribution.
            const acc = players[i].target + (Math.random() - 0.5) * 0.04;
            if (acc > 0.985 && r < 0.2)        judgments[i].w0  += 1;
            else if (acc > 0.96 && r < 0.78)   judgments[i].w1  += 1;
            else if (r < 0.90)                 judgments[i].w2  += 1;
            else if (r < 0.97)                 judgments[i].w3  += 1;
            else if (r < 0.99)                 judgments[i].w4  += 1;
            else                               judgments[i].w5  += 1;
          }
          // Occasional miss — drives combo-break flash.
          if (Math.random() < 0.012) judgments[i].miss += 1;
        }

        const players_state = [0, 1].map((i) => {
          const j = judgments[i];
          const judged = j.w0 + j.w1 + j.w2 + j.w3 + j.w4 + j.w5 + j.miss;
          // Crude ITG % approximation: weighted average of windows.
          const weighted =
            j.w0 * 1.0 + j.w1 * 1.0 + j.w2 * 0.98 + j.w3 * 0.6 +
            j.w4 * 0.2 + j.w5 * (-0.4) + j.miss * (-0.8);
          const score = judged > 0 ? Math.max(0, weighted / judged) : 0;
          // Slow swap: nudge each player toward their target.
          const blended = score * 0.6 + players[i].target * 0.4;
          return {
            profile_name: players[i].name,
            initials: players[i].ini,
            groovestats_username: players[i].name.toLowerCase(),
            arrowcloud_user_id: null,
            score_percent: blended,
            ex_score_percent: blended * 0.96,
            hard_ex_score_percent: blended * 0.91,
            grade: gradeFor(blended),
            disqualified: false,
            combo: judged - j.miss,
            modifiers: players[i].mods,
            personal_best: { itg: 0.965, ex: 0.92, hard_ex: 0.85 },
            judgments: { ...j },
          };
        });

        const snapshot = {
          schema_version: 1,
          timestamp_ms: Date.now(),
          screen: 'ScreenGameplay',
          machine_id: 'demo-cab',
          song: SONG,
          chart: CHART,
          players: players_state,
          elapsed_seconds: elapsed,
          music_rate: 1.0,
        };
        render(snapshot);
      }

      step();
      setInterval(step, 250);
    }

    // Decide between live and demo: explicit ?demo=1 wins; otherwise
    // running over file:// with no ?host= and no telemetry server
    // available falls back to demo automatically after the first
    // failed connection so testing the overlay locally is one click.
    if (demoExplicit) {
      startDemo();
    } else {
      // Live mode: try connecting; on first hard failure with file://
      // fall back to demo with a visible "DEMO" status so the file is
      // still useful as a one-click preview.
      const fallbackToDemo = location.protocol === 'file:' && !params.get('host');
      let triedDemo = false;
      const realScheduleReconnect = scheduleReconnect;
      // Wrap scheduleReconnect to convert the first error into a demo
      // when running off the local filesystem.
      // eslint-disable-next-line no-func-assign
      scheduleReconnect = function () {
        if (fallbackToDemo && !triedDemo) {
          triedDemo = true;
          startDemo();
          return;
        }
        realScheduleReconnect();
      };
      connect();
    }
  </script>
</body>
</html>

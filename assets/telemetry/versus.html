<!DOCTYPE html>
<!--
  DeadSync live state — VERSUS overlay.

  Side-by-side score comparison overlay for tournament/versus
  broadcasts. Both players' state is always published regardless of
  each player's in-game show/hide preferences, so the broadcast can
  show full information either way.

  URL parameters (append to the OBS Browser Source URL):
    ?host=10.0.0.11   game-PC host (default 127.0.0.1)
    ?port=8765        telemetry port (default 8765)
    ?metric=itg       which score type to compare:
                        itg     - ITG % (default)
                        ex      - EX %
                        hardex  - Hard EX %

  Recommended OBS source size: 1280 x 220.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeadSync — Versus</title>
  <style>
    :root {
      --bg-card: rgba(0, 0, 0, 0.55);
      --fg: #f5f5f5;
      --muted: #9aa0a6;
      --p1: #4ea8ff;
      --p2: #ff6868;
      --neutral: #888;
      --good: #6cd36c;
      --bad: #ff7f7f;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--fg);
      font: 16px/1.2 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .stage {
      box-sizing: border-box;
      width: 100%;
      max-width: 1280px;
      padding: 14px 18px 8px 18px;
      background: var(--bg-card);
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .panel.right { text-align: right; align-items: flex-end; }
    .name {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name.p1 { color: var(--p1); }
    .name.p2 { color: var(--p2); }
    .score {
      font-size: 38px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .grade {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .grade.pulse { animation: grade-pulse 700ms ease-out; }
    @keyframes grade-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.4); color: #fff; text-shadow: 0 0 16px var(--accent, #fff); }
      100% { transform: scale(1); }
    }
    .judgments {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      display: flex;
      gap: 10px;
    }
    .panel.right .judgments { justify-content: flex-end; }
    .judgments .miss { color: var(--bad); font-weight: 600; }
    .judgments .miss.flash { animation: miss-flash 800ms ease-out; }
    @keyframes miss-flash {
      0%   { transform: scale(1); color: var(--bad); }
      30%  { transform: scale(1.5); color: #fff; text-shadow: 0 0 12px var(--bad); }
      100% { transform: scale(1); color: var(--bad); }
    }
    .judgments .w0 { color: #80e0ff; font-weight: 600; }
    .modifiers {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      margin-top: 2px;
    }
    .panel.right .modifiers { justify-content: flex-end; }
    .modifier-chip {
      background: rgba(255, 215, 102, 0.15);
      color: #ffd166;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .pb-delta {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      color: var(--muted);
    }
    .pb-delta .positive { color: var(--good); font-weight: 600; }
    .pb-delta .negative { color: var(--bad); }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 280px;
    }
    .delta {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      min-height: 22px;
    }
    .delta.p1 { color: var(--p1); }
    .delta.p2 { color: var(--p2); }
    .delta.tied { color: var(--neutral); }
    .lead-change {
      font-size: 11px;
      min-height: 14px;
      margin-bottom: 6px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      transition: opacity 400ms ease-out;
    }
    .lead-change.p1 { color: var(--p1); }
    .lead-change.p2 { color: var(--p2); }
    .lead-change.fade { opacity: 0; }
    .h2h {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .h2h .fill {
      position: absolute;
      top: 0;
      bottom: 0;
      transition: width 200ms ease-out;
    }
    .h2h .fill.p1 { left: 0; background: linear-gradient(90deg, transparent, var(--p1)); }
    .h2h .fill.p2 { right: 0; background: linear-gradient(270deg, transparent, var(--p2)); }
    .metric-label {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .progress {
      margin-top: 10px;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress.hidden { visibility: hidden; }
    .progress > .fill {
      height: 100%;
      background: var(--neutral);
      width: 0%;
      transition: width 250ms linear;
    }
    .status {
      position: fixed;
      top: 4px;
      right: 8px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .status.ok { color: var(--good); }
    .status.bad { color: var(--bad); }
    .empty .score { opacity: 0.35; }
  </style>
</head>
<body>
  <div id="status" class="status">connecting…</div>
  <div class="stage">
    <div class="row">
      <div id="p1" class="panel left empty">
        <div class="name p1" id="p1-name">P1</div>
        <div class="score" id="p1-score">--.--%</div>
        <div class="grade" id="p1-grade"></div>
        <div class="judgments" id="p1-judgments"></div>
        <div class="modifiers" id="p1-modifiers"></div>
        <div class="pb-delta" id="p1-pb"></div>
      </div>
      <div class="center">
        <div id="lead-change" class="lead-change fade"></div>
        <div id="delta" class="delta tied">tied</div>
        <div class="h2h">
          <div id="h2h-p1" class="fill p1" style="width: 50%;"></div>
          <div id="h2h-p2" class="fill p2" style="width: 50%;"></div>
        </div>
        <div class="metric-label" id="metric-label">ITG %</div>
      </div>
      <div id="p2" class="panel right empty">
        <div class="name p2" id="p2-name">P2</div>
        <div class="score" id="p2-score">--.--%</div>
        <div class="grade" id="p2-grade"></div>
        <div class="judgments" id="p2-judgments"></div>
        <div class="modifiers" id="p2-modifiers"></div>
        <div class="pb-delta" id="p2-pb"></div>
      </div>
    </div>
    <div id="progress" class="progress hidden"><div id="progress-fill" class="fill"></div></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const host = params.get('host') || '127.0.0.1';
    const port = parseInt(params.get('port') || '8765', 10);
    const token = params.get('token') || '';
    const tokenSuffix = token ? `?token=${encodeURIComponent(token)}` : '';
    const metric = (params.get('metric') || 'itg').toLowerCase();

    const METRICS = {
      itg:    { field: 'score_percent',         label: 'ITG %',     pb: 'itg' },
      ex:     { field: 'ex_score_percent',      label: 'EX %',      pb: 'ex' },
      hardex: { field: 'hard_ex_score_percent', label: 'HARD EX %', pb: 'hard_ex' },
    };
    const cfg = METRICS[metric] || METRICS.itg;
    document.getElementById('metric-label').textContent = cfg.label;

    // Grade ranking (low -> high) for grade-up pulse detection.
    const GRADE_ORDER = [
      'Failed', 'Tier17', 'Tier16', 'Tier15', 'Tier14', 'Tier13', 'Tier12',
      'Tier11', 'Tier10', 'Tier09', 'Tier08', 'Tier07', 'Tier06', 'Tier05',
      'Tier04', 'Tier03', 'Tier02', 'Tier01', 'Quint',
    ];
    const gradeIdx = (g) => {
      const i = GRADE_ORDER.indexOf(g || '');
      return i < 0 ? -1 : i;
    };

    const url = `ws://${host}:${port}${tokenSuffix}`;
    const $ = (id) => document.getElementById(id);
    const fmtPct = (x) => (x * 100).toFixed(2) + '%';

    function judgmentLine(j) {
      if (!j) return '';
      const parts = [];
      if (j.w0) parts.push(`<span class="w0">${j.w0}</span>`);
      parts.push(`${j.w1 || 0}`);
      parts.push(`${j.w2 || 0}`);
      parts.push(`${j.w3 || 0}`);
      if (j.w4) parts.push(`${j.w4}`);
      if (j.w5) parts.push(`${j.w5}`);
      // Always render a miss element so we can flash it when count goes 0->n.
      parts.push(`<span class="miss" data-count="${j.miss || 0}">${j.miss || 0} miss</span>`);
      return parts.join(' / ');
    }

    function modifierChips(mods) {
      if (!mods || !mods.length) return '';
      return mods.map((m) => `<span class="modifier-chip">${m}</span>`).join('');
    }

    function pbLine(player) {
      if (!player || !player.personal_best) return '';
      const pb = player.personal_best[cfg.pb];
      const live = Number(player[cfg.field]);
      if (!Number.isFinite(pb) || !Number.isFinite(live)) return '';
      const delta = live - pb;
      const cls = delta >= 0 ? 'positive' : 'negative';
      const sign = delta >= 0 ? '+' : '−';
      return `${cfg.label} PB <span class="${cls}">${sign}${(Math.abs(delta) * 100).toFixed(2)}%</span>`;
    }

    // Per-side previous values for combo-break / grade-up detection.
    const prev = { p1: { miss: 0, grade: null }, p2: { miss: 0, grade: null } };

    function renderSide(sideKey, player) {
      const panel = $(sideKey);
      const name = $(`${sideKey}-name`);
      const score = $(`${sideKey}-score`);
      const jud = $(`${sideKey}-judgments`);
      const grade = $(`${sideKey}-grade`);
      const mods = $(`${sideKey}-modifiers`);
      const pb = $(`${sideKey}-pb`);

      if (!player) {
        panel.classList.add('empty');
        score.textContent = '--.--%';
        jud.innerHTML = '';
        grade.textContent = '';
        mods.innerHTML = '';
        pb.innerHTML = '';
        return null;
      }
      panel.classList.remove('empty');
      name.textContent = player.profile_name || sideKey.toUpperCase();
      const value = Number(player[cfg.field]) || 0;
      score.textContent = fmtPct(value);
      jud.innerHTML = judgmentLine(player.judgments);

      // Combo-break flash: if miss went 0 -> any, flash the miss element.
      const pState = prev[sideKey];
      const newMiss = (player.judgments && player.judgments.miss) || 0;
      if (pState.miss === 0 && newMiss > 0) {
        const missEl = jud.querySelector('.miss');
        if (missEl) {
          // Re-trigger by removing then adding the class on next frame.
          missEl.classList.remove('flash');
          // eslint-disable-next-line no-void
          void missEl.offsetWidth;
          missEl.classList.add('flash');
        }
      }
      pState.miss = newMiss;

      // Grade-up pulse.
      const newGrade = player.grade || null;
      if (pState.grade && newGrade && gradeIdx(newGrade) > gradeIdx(pState.grade)) {
        grade.classList.remove('pulse');
        // eslint-disable-next-line no-void
        void grade.offsetWidth;
        grade.classList.add('pulse');
      }
      grade.textContent = newGrade || '';
      pState.grade = newGrade;

      mods.innerHTML = modifierChips(player.modifiers);
      pb.innerHTML = pbLine(player);
      return value;
    }

    // Sliding-window lead delta tracker. Holds (timestamp, p1Score-p2Score)
    // samples for the last LEAD_WINDOW_MS milliseconds; the printed value
    // is the change in (p1-p2) from the oldest in-window sample to now.
    const LEAD_WINDOW_MS = 10_000;
    const leadSamples = [];
    let leadFadeTimer = 0;
    function updateLeadChange(diff) {
      const t = Date.now();
      leadSamples.push([t, diff]);
      // Drop samples older than the window.
      while (leadSamples.length > 0 && t - leadSamples[0][0] > LEAD_WINDOW_MS) {
        leadSamples.shift();
      }
      if (leadSamples.length < 2) return;
      const oldest = leadSamples[0][1];
      const swing = diff - oldest; // positive => p1 gained relative to p2
      const el = $('lead-change');
      if (Math.abs(swing) < 0.0005) {
        el.classList.add('fade');
        return;
      }
      const sign = swing > 0 ? '+' : '−';
      el.textContent = `${sign}${(Math.abs(swing) * 100).toFixed(2)}% in last ${Math.round(LEAD_WINDOW_MS / 1000)}s`;
      el.classList.remove('p1', 'p2', 'fade');
      el.classList.add(swing > 0 ? 'p1' : 'p2');
      clearTimeout(leadFadeTimer);
      leadFadeTimer = setTimeout(() => el.classList.add('fade'), 4000);
    }

    function leadToBias(delta) {
      const sign = Math.sign(delta);
      const mag = Math.min(Math.abs(delta), 0.05) / 0.05; // saturate at 5%
      const eased = 1 - Math.pow(1 - mag, 3);
      return sign * eased;
    }

    function render(snapshot) {
      const players = Array.isArray(snapshot.players) ? snapshot.players : [];
      const v1 = renderSide('p1', players[0]);
      const v2 = renderSide('p2', players[1]);

      const delta = $('delta');
      const fillP1 = $('h2h-p1');
      const fillP2 = $('h2h-p2');

      if (v1 == null || v2 == null) {
        delta.textContent = '';
        delta.className = 'delta tied';
        fillP1.style.width = '50%';
        fillP2.style.width = '50%';
      } else {
        const diff = v1 - v2;
        if (Math.abs(diff) < 1e-5) {
          delta.textContent = 'tied';
          delta.className = 'delta tied';
        } else {
          const sign = diff > 0 ? '+' : '−';
          delta.textContent = `${sign}${(Math.abs(diff) * 100).toFixed(2)}%`;
          delta.className = `delta ${diff > 0 ? 'p1' : 'p2'}`;
        }
        const bias = leadToBias(diff);
        const p1Pct = 50 + bias * 50;
        const p2Pct = 50 - bias * 50;
        fillP1.style.width = `${Math.max(0, Math.min(100, p1Pct))}%`;
        fillP2.style.width = `${Math.max(0, Math.min(100, p2Pct))}%`;
        updateLeadChange(diff);
      }

      // Progress bar: prefer chart end (last note) over music length.
      const song = snapshot.song;
      const denom =
        (song && Number(song.chart_length_seconds)) ||
        (song && Number(song.music_length_seconds)) || 0;
      const elapsed = Number(snapshot.elapsed_seconds);
      const progress = $('progress');
      if (denom > 0 && Number.isFinite(elapsed) && elapsed >= 0) {
        progress.classList.remove('hidden');
        $('progress-fill').style.width = `${Math.max(0, Math.min(100, (elapsed / denom) * 100))}%`;
      } else {
        progress.classList.add('hidden');
        $('progress-fill').style.width = '0%';
      }
    }

    let backoff = 500;
    function connect() {
      $('status').textContent = `connecting ${url}…`;
      $('status').className = 'status';
      let ws;
      try { ws = new WebSocket(url); }
      catch (err) {
        $('status').textContent = `error: ${err.message}`;
        $('status').className = 'status bad';
        scheduleReconnect();
        return;
      }
      ws.onopen = () => {
        $('status').textContent = `live · ${cfg.label}`;
        $('status').className = 'status ok';
        backoff = 500;
      };
      ws.onmessage = (ev) => {
        try { render(JSON.parse(ev.data)); }
        catch (err) { console.warn('telemetry: bad payload', err); }
      };
      ws.onerror = () => {
        $('status').textContent = 'error';
        $('status').className = 'status bad';
      };
      ws.onclose = () => {
        $('status').textContent = 'disconnected — retrying';
        $('status').className = 'status bad';
        scheduleReconnect();
      };
    }
    function scheduleReconnect() {
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 5000);
    }
    connect();
  </script>
</body>
</html>

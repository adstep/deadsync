[package]
name = "deadsync-visionbot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "External vision bot + timing analyzer for measuring DeadSync visual-vs-audio press precision."
publish = false

[[bin]]
name = "deadsync-visionbot"
path = "src/main.rs"

[[bin]]
name = "timing-analyze"
path = "src/bin/timing_analyze.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8.19"
log = "0.4.30"
env_logger = "0.11.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

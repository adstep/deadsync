name: release-windows-win7

# Build a Windows 7 / Windows 7 Embedded compatible release of deadsync.exe
# using Rust's Tier 3 `x86_64-win7-windows-msvc` target.
#
# Background: since Rust 1.78 the standard library imports `ProcessPrng` from
# `bcryptprimitives.dll`, which only exists on Windows 10 build 17763 (1809)
# and later. The Win7 target rebuilds std to use `RtlGenRandom` instead, so
# the resulting binary launches successfully on Win7 SP1 and up.
#
# Tier 3 targets require a nightly toolchain and `-Z build-std`. They are not
# covered by Rust's CI guarantees, so this workflow may break between
# nightlies — pin the nightly date below if you need reproducibility.
#
# The workflow is opt-in (manual dispatch or push of a `*-win7` tag) so it
# never interferes with the main release process. When run on a fork, the
# GitHub release is published against the fork.

on:
  push:
    tags:
      - "v*-win7"
      - "win7-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.4.271-win7)"
        required: true
        type: string
      publish_release:
        description: "Publish a GitHub release on this repo"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_TARGET: x86_64-win7-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: scripts/install-vulkan-sdk.ps1

      - name: Install Ninja
        shell: pwsh
        run: scripts/install-ninja.ps1

      - name: Install CMake
        shell: pwsh
        run: scripts/install-cmake.ps1

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          tag="${tag#refs/tags/}"
          if [ -z "${tag}" ]; then
            echo "Release tag is required." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup Rust nightly (with rust-src)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Show toolchain
        run: |
          rustc +nightly -vV
          cargo +nightly -vV

      - name: Build release (Win7 Tier 3 target)
        # --locked is intentionally omitted: -Z build-std rewrites the lockfile
        # to include sysroot dependencies, which the existing Cargo.lock does
        # not pin.
        run: >
          cargo +nightly build
          --release
          --bin deadsync
          --target ${{ env.RUST_TARGET }}
          -Z build-std=std,panic_abort

      - name: Package Windows Win7 release
        id: package
        shell: pwsh
        run: >
          scripts/package-windows-release.ps1
          -Tag "${{ steps.tag.outputs.tag }}"
          -Arch x86_64
          -Variant win7
          -ExtraReadme docs/WINDOWS-7-COMPAT.md
          -BinPath "target/${{ env.RUST_TARGET }}/release/deadsync.exe"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deadsync-windows-win7-${{ steps.tag.outputs.tag }}-x86_64
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.tag }} (Windows 7 compat)
          body: |
            Windows 7 / Windows 7 Embedded compatible build of deadsync.

            Built with Rust nightly + `-Z build-std` targeting the Tier 3
            `x86_64-win7-windows-msvc` triple. This rebuilds the standard
            library to use `RtlGenRandom` instead of `ProcessPrng`, so the
            binary no longer requires the Windows 10 1809+ export from
            `bcryptprimitives.dll`.

            See `docs/WINDOWS-7-COMPAT.md` (also included inside the archive)
            for requirements and troubleshooting.
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          prerelease: true
          fail_on_unmatched_files: true
